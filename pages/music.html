<!DOCTYPE html>
<html>

<head>
  <title>Musics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../main.css" />
  <link rel="stylesheet" href="../styles/navbar.css" />
  <link rel="stylesheet" href="../styles/variables.css" />
  <link rel="stylesheet" href="../styles/index/musics.css" />
  <link rel="stylesheet" href="../styles/index/skills.css" />
</head>

<body>
  <div class="starfield"></div>
  <div id="navbar-sticky">
    <div id="navbar" class="navbar-border">
      <a class="navbar-button navbar-button-text navbar-text-important" href="../index.html">Portfolyocuk</a>
      <div id="navbar_right">
        <div id="navbar_menu">
          <a class="navbar-button navbar-button-text" href="../pages/project.html"> Projects </a>
          <a class="navbar-button navbar-button-text" href="../pages/model.html"> Models </a>
          <a class="navbar-button navbar-button-text" href="../pages/music.html"> Music </a>
        </div>
        <div class="navbar-language">
          <button class="navbar-button navbar-button-text navbar-language-button" id="navbar_language-button"
            aria-label="Select language">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
              <path d="M3.6 9h16.8" />
              <path d="M3.6 15h16.8" />
              <path d="M11.5 3a17 17 0 0 0 0 18" />
              <path d="M12.5 3a17 17 0 0 1 0 18" />
            </svg>
            <span id="navbar_language-current">EN</span>
            <svg class="navbar-language-chevron" width="12" height="8" viewBox="0 0 12 8" fill="none">
              <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" />
            </svg>
          </button>
          <div id="navbar_language-dropdown" class="navbar-language-dropdown">
            <button class="navbar-language-option active" data-language="en">
              <span class="navbar-language-flag">🇬🇧</span>
              <span>English</span>
            </button>
            <button class="navbar-language-option" data-language="tr">
              <span class="navbar-language-flag">🇹🇷</span>
              <span>Türkçe</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="musics" class="margin-main">
    <h1 class="text-align-center h1-shadow margin-bottom-large">Musics</h1>
    <p class="music-intro text-align-center margin-bottom-large">I'm a music composer at heart — my most beloved hobby. Most of what I write lives in the ambient and dark ambient corners of sound, where things stay quiet a little longer.</p>
    <div class="music_sort-box">
      <div class="music_sort-dropdown skill_filter-dropdown">
        <button class="skill_filter-box-button" onclick="toggleSortDropdown()">
          <span>Newest First</span>
          <svg class="skill_filter-chevron" width="12" height="8" viewBox="0 0 12 8" fill="none">
            <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <div id="music-sort-dropdown" class="skill_filter-dropdown-content">
          <div class="skill_filter-dropdown-header">Sort by</div>
          <div class="skill_filter-dropdown-tags">
            <button class="skill_filter-tag music_sort-tag active" data-sort="new-old">
              <span class="skill_filter-tag-check"></span>
              <span>Newest First</span>
            </button>
            <button class="skill_filter-tag music_sort-tag" data-sort="old-new">
              <span class="skill_filter-tag-check"></span>
              <span>Oldest First</span>
            </button>
            <button class="skill_filter-tag music_sort-tag" data-sort="name">
              <span class="skill_filter-tag-check"></span>
              <span>Name (A-Z)</span>
            </button>
          </div>
        </div>
      </div>
      <div class="skill-text-primary text-high-weight">All platforms: YouTube & SoundCloud</div>
    </div>
    <div class="music_grid-box"></div>
  </div>
  <script src="../scripts/music.js"></script>
  <script src="../scripts/stars.js"></script>
</body>

</html>
